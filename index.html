const TARGETS_PER_BRANCH = 20;
const TICKET_TARGETS_PER_BRANCH = 10; // برای کارشناسان تیکت: به‌ازای هر ۱۰ تیکت، ۱ لیوان آب

/* پله‌های پاداش کارشناس تیکت (بر اساس تعداد کل تیکت در بازه)
   مبالغ به ریال هستند (تبدیل‌شده از تومان با ضرب در ۱۰ تا با مبلغ قابل پرداخت هم‌واحد باشند).
   اگر تعداد تیکت به هیچ پله‌ای نرسیده باشد، پاداش صفر است. */
const TICKET_BONUS_TIERS = [
  { tickets: 300,  amount: 10000000 },
  { tickets: 450,  amount: 25000000 },
  { tickets: 600,  amount: 35000000 },
  { tickets: 800,  amount: 45000000 },
  { tickets: 1100, amount: 60000000 },
];

/* پله‌های پاداش کارشناس تیکت که insure_types آن‌ها «بدنه» است (نرخ‌ها/پاداش‌ها متفاوت از سایر انواع بیمه‌ست)
   مبالغ تصویر به تومان بودند و اینجا ×۱۰ شده‌اند تا با ریال هم‌واحد باشند */
const TICKET_BONUS_TIERS_BODY = [
  { tickets: 300,  amount: 10000000 },
  { tickets: 450,  amount: 25000000 },
  { tickets: 600,  amount: 35000000 },
  { tickets: 800,  amount: 45000000 },
  { tickets: 1100, amount: 60000000 },
];

// بر اساس insure_types هر ردیف، جدول پله‌ی پاداش مناسب را برمی‌گرداند
function tierTableForInsureType(insureType) {
  return insureType === 'بدنه' ? TICKET_BONUS_TIERS_BODY : TICKET_BONUS_TIERS;
}


function ticketBonusForTotal(ticketTotal, tiers = TICKET_BONUS_TIERS) {
  let reached = null;
  for (const tier of tiers) {
    if (ticketTotal >= tier.tickets) reached = tier;
  }
  return reached;
}

// اولین پله‌ای که هنوز کارشناس بهش نرسیده (برای نمایش راهنمای «تا پله بعدی چقدر مانده»)
function nextTicketBonusTier(ticketTotal, tiers = TICKET_BONUS_TIERS) {
  for (const tier of tiers) {
    if (ticketTotal < tier.tickets) return tier;
  }
  return null;
}
const PLANT_MAX_STAGE = 40; // سقف تعداد شاخه‌ها؛ فراتر از حد فعلیِ نیاز (۳۰) کمی جا برای رشد بیشتر دارد

/* سه طرح پایه‌ی گل داریم (flower--1/2/3). سه شاخه‌ی اول همون طرح‌های اصلی‌ان.
   از شاخه‌ی چهارم به بعد، با هر لیوان آب، دوباره از همین سه طرح استفاده می‌شه ولی
   هر شاخه با زاویه و اندازه‌ی متفاوتی باز می‌شه؛ یعنی واقعاً یک «شاخه‌ی تازه»
   به بوته اضافه می‌شه، نه یک تزئین جداگانه (چمن/برگ و...). */

function flowerLeafsBlock(suffix) {
  return `
      <div class="flower__leafs${suffix}">
        <div class="flower__leaf flower__leaf--1"></div>
        <div class="flower__leaf flower__leaf--2"></div>
        <div class="flower__leaf flower__leaf--3"></div>
        <div class="flower__leaf flower__leaf--4"></div>
        <div class="flower__white-circle"></div>
        <div class="flower__light flower__light--1"></div>
        <div class="flower__light flower__light--2"></div>
        <div class="flower__light flower__light--3"></div>
        <div class="flower__light flower__light--4"></div>
        <div class="flower__light flower__light--5"></div>
        <div class="flower__light flower__light--6"></div>
        <div class="flower__light flower__light--7"></div>
        <div class="flower__light flower__light--8"></div>
      </div>`;
}

function flowerLineBlock(leafCount) {
  let leafs = '';
  for (let i = 1; i <= leafCount; i++) {
    leafs += `\n        <div class="flower__line__leaf flower__line__leaf--${i}"></div>`;
  }
  return `
      <div class="flower__line">${leafs}
      </div>`;
}

/* تعداد برگ‌های روی ساقه‌ی هر طرح (برای تنوعِ دیداری بین طرح‌ها) */
const BRANCH_LEAF_COUNT = { 1: 6, 2: 4, 3: 4 };

function branchHTML(variant, leafsSuffix, extraStyle) {
  const style = extraStyle ? ` style="${extraStyle}"` : '';
  return `<div class="flower flower--${variant}"${style}>${flowerLeafsBlock(leafsSuffix)}${flowerLineBlock(BRANCH_LEAF_COUNT[variant])}
    </div>`;
}

/* زاویه‌ی باز شدنِ شاخه‌های اضافه (چهارم به بعد)؛ به‌ترتیب چپ و راست بازتر می‌شه
   تا دسته‌گل هر بار پهن‌تر و پرپشت‌تر به‌نظر برسه. کافیه لیست رو طولانی‌تر کرد
   تا شاخه‌های بیشتری هم پشتیبانی بشه. */
const EXTRA_BRANCH_ANGLES = [34, -34, 48, -48, 10, -10, 60, -60, 24, -24, 70, -70, 4, -4, 42, -42, 55, -55, 16, -16];

function extraBranchHTML(index) {
  const variant = (index % 3) + 1;
  const angle = EXTRA_BRANCH_ANGLES[index % EXTRA_BRANCH_ANGLES.length];
  const scale = (0.85 + (index % 4) * 0.07).toFixed(2);
  const style = `animation: sway-branch 4s linear infinite; --base-angle: ${angle}deg; --branch-scale: ${scale};`;
  return branchHTML(variant, '', style);
}

const GARDEN_STAGES = [
  branchHTML(1, '--1'),
  branchHTML(2, '--2'),
  branchHTML(3, '--3'),
  ...Array.from({ length: Math.max(0, PLANT_MAX_STAGE - 3) }, (_, i) => extraBranchHTML(i))
];

// از هر ۲۰ عدد تارگتِ مجموعِ بازه، ۱ شاخه‌گل ساخته می‌شود (تقسیم صحیح، بدون گرد کردن به بالا)
// perCup اختیاریه؛ اگه ندی همون ۲۰ تای پیش‌فرض (نیروی عادی) استفاده می‌شه.
// برای کارشناسان تیکت، از بیرون با perCup=10 صدا زده می‌شه (به‌ازای هر ۱۰ تیکت، ۱ لیوان).
function cupsForPeriodTotal(total, perCup) {
  const divisor = perCup || TARGETS_PER_BRANCH;
  return Math.max(0, Math.floor((Number(total) || 0) / divisor));
}

let plantState = { usedCups: 0, stage: 0, availableCups: 0, earnedCups: 0 };

/* هرچه شاخه‌های بیشتری اضافه شود، دسته‌گل پهن‌تر باز می‌شود (شاخه‌های اضافه تا
   ۷۰ درجه از مرکز باز می‌شوند)؛ اگر همیشه با همون اندازه‌ی ثابت رندر بشه، از
   یک جایی به بعد از کادرِ گلدون (که overflow:hidden داره) می‌زنه بیرون و
   لبه‌های گل/برگ به‌شکل زشتی بریده می‌شوند. برای همین با افزایش تعداد شاخه‌ها
   کل دسته‌گل کمی جمع‌وجورتر (مقیاس کوچک‌تر) رندر می‌شود تا همیشه داخل کادر جا
   شود، بدون اینکه به زاویه یا چیدمان خودِ شاخه‌ها دست بزنیم. */
const FLOWERS_BASE_SCALE = 0.9;
const FLOWERS_MIN_SCALE = 0.48;
const FLOWERS_SHRINK_START_STAGE = 4; // تا سه شاخه‌ی اول اندازه‌ی عادی حفظ می‌شود

function flowersScaleForStage(stage) {
  if (stage <= FLOWERS_SHRINK_START_STAGE) return FLOWERS_BASE_SCALE;
  const span = Math.max(1, PLANT_MAX_STAGE - FLOWERS_SHRINK_START_STAGE);
  const t = Math.min(1, (stage - FLOWERS_SHRINK_START_STAGE) / span);
  return FLOWERS_BASE_SCALE - (FLOWERS_BASE_SCALE - FLOWERS_MIN_SCALE) * t;
}

function applyFlowersScale(stage) {
  const container = document.getElementById('flowers-container');
  if (!container) return;
  container.style.setProperty('--flowers-scale', flowersScaleForStage(stage));
}

/* رندر «افزایشی» شاخه‌ها: به‌جای بازسازی کامل innerHTML (که باعث می‌شد همه‌ی
   شاخه‌های قبلی هم دوباره از اول انیمیشن روییدن/شکفتن را اجرا کنند)، فقط
   شاخه‌ی(های) تازه با insertAdjacentHTML به انتهای گلدون اضافه می‌شوند و
   شاخه‌های قبلی دست‌نخورده باقی می‌مانند. فقط در حالتی که تعداد باید کم شود
   (مثلاً با شروع یک بازه‌ی جدید) کل صحنه از نو ساخته می‌شود. */
function updatePlantStageVisual(stage) {
  const container = document.getElementById('flowers-container');
  if (!container) return;
  const currentCount = container.children.length;

  applyFlowersScale(stage);

  if (stage < currentCount) {
    container.innerHTML = GARDEN_STAGES.slice(0, stage).join('');
    return;
  }
  if (stage > currentCount) {
    const newBranchesHTML = GARDEN_STAGES.slice(currentCount, stage).join('');
    container.insertAdjacentHTML('beforeend', newBranchesHTML);

    const flowerScene = document.getElementById('flower-scene');
    if (flowerScene) {
      flowerScene.classList.add('watering-flash');
      setTimeout(() => flowerScene.classList.remove('watering-flash'), 900);
    }
  }
}

function plantStorageKey() {
  return `plant_state_${currentUserId || 'guest'}_${currentPeriodKey || 'na'}`;
}

function loadPlantSavedState() {
  try {
    const raw = localStorage.getItem(plantStorageKey());
    if (!raw) return { usedCups: 0, stage: 0 };
    const parsed = JSON.parse(raw);
    return {
      usedCups: Number(parsed.usedCups) || 0,
      stage: Math.min(Number(parsed.stage) || 0, PLANT_MAX_STAGE)
    };
  } catch (e) {
    return { usedCups: 0, stage: 0 };
  }
}

function savePlantState() {
  try {
    localStorage.setItem(plantStorageKey(), JSON.stringify({
      usedCups: plantState.usedCups,
      stage: plantState.stage
    }));
  } catch (e) { /* اگر localStorage در دسترس نبود، مشکلی پیش نمی‌آید */ }
}

function updateWaterCursorFillState() {
  const cursor = document.getElementById('water-cursor');
  if (!cursor) return;
  cursor.classList.toggle('is-empty', plantState.availableCups < 1);
  cursor.classList.toggle('is-full', plantState.availableCups >= 1);
}

function updatePlantWidget(earnedCups) {
  const saved = loadPlantSavedState();
  const availableCups = Math.max(0, earnedCups - saved.usedCups);

  plantState = {
    usedCups: saved.usedCups,
    stage: saved.stage,
    availableCups,
    earnedCups
  };

  updatePlantStageVisual(saved.stage);
  updateWaterCursorFillState();
}

/* با کلیک روی گلدون، اگر لیوان آبی در دسترس باشد یک شاخه‌ی تازه رشد می‌کند و
   یک لیوان از موجودی کم می‌شود؛ اگر آبی نمانده باشد فقط یک تکانِ خالی (بدون رشد) نشان داده می‌شود. */
function waterPlantOnce() {
  const cursor = document.getElementById('water-cursor');

  if (plantState.availableCups < 1) {
    if (cursor) {
      cursor.classList.remove('shake');
      void cursor.offsetWidth; // ری‌استارتِ انیمیشن در صورت کلیک‌های پی‌درپی
      cursor.classList.add('shake');
    }
    return;
  }

  if (cursor) {
    cursor.classList.add('pouring');
    setTimeout(() => cursor.classList.remove('pouring'), 260);
  }

  const grew = plantState.stage < PLANT_MAX_STAGE;
  plantState.usedCups += 1;
  plantState.stage = Math.min(plantState.stage + 1, PLANT_MAX_STAGE);
  plantState.availableCups = Math.max(0, plantState.earnedCups - plantState.usedCups);
  savePlantState();

  if (grew) {
    setTimeout(() => updatePlantStageVisual(plantState.stage), 140);
  }
  updateWaterCursorFillState();
}

/* ---------- جابجا کردن گلدون با کشیدن + آب دادن با کلیک ----------
   از یک آستانه‌ی حرکتی برای تشخیص «کشیدن» از «کلیک» استفاده می‌شود:
   اگر انگشت/موس کمی جابه‌جا شود، گلدون جابه‌جا می‌شود؛ اگر تقریباً بدون
   حرکت رها شود، به‌عنوان کلیکِ آب‌دادن حساب می‌شود. */
function plantPositionStorageKey() {
  return `plant_position_${currentUserId || 'guest'}`;
}
// شماره‌ی فرمت مختصات ذخیره‌شده (نسبت به viewport)؛ برای رد کردن مقادیر ناسازگار قدیمی
const PLANT_POSITION_VERSION = 2;

function applyPlantPosition(left, top) {
  const widget = document.getElementById('plant-widget');
  if (!widget) return;
  const maxLeft = Math.max(0, window.innerWidth - widget.offsetWidth);
  const maxTop = Math.max(0, window.innerHeight - widget.offsetHeight);
  const clampedLeft = Math.min(Math.max(0, left), maxLeft);
  const clampedTop = Math.min(Math.max(0, top), maxTop);
  widget.style.left = `${clampedLeft}px`;
  widget.style.top = `${clampedTop}px`;
  widget.style.bottom = 'auto';
  widget.style.right = 'auto';
}

function moveWaterCursorTo(clientX, clientY) {
  const cursor = document.getElementById('water-cursor');
  if (!cursor) return;
  // نوکِ لیوان کمی بالاتر و چپ‌تر از نوکِ اشاره‌گر قرار می‌گیرد
  cursor.style.setProperty('--wc-x', `${clientX - 8}px`);
  cursor.style.setProperty('--wc-y', `${clientY - 34}px`);
}

const DRAG_THRESHOLD = 6; // پیکسل

function initPlantDrag() {
  const widget = document.getElementById('plant-widget');
  const cursor = document.getElementById('water-cursor');
  if (!widget || widget.dataset.dragBound) return;
  widget.dataset.dragBound = '1';

  // موقعیت ذخیره‌شده‌ی این کاربر را اعمال کن؛ در غیر این صورت همان موقعیت پیش‌فرض
  // (گوشه‌ی پایین صفحه، دور از فهرست تارگت‌ها) که در CSS تعریف شده باقی می‌ماند.
  // مختصات ذخیره‌شده نسبت به viewport هستن؛ نسخه‌ی ناسازگار/قدیمی نادیده گرفته می‌شه.
  try {
    const raw = localStorage.getItem(plantPositionStorageKey());
    if (raw) {
      const pos = JSON.parse(raw);
      if (pos.v === PLANT_POSITION_VERSION && Number.isFinite(pos.left) && Number.isFinite(pos.top)) {
        applyPlantPosition(pos.left, pos.top);
      } else {
        localStorage.removeItem(plantPositionStorageKey());
      }
    }
  } catch (e) { /* در صورت نبودِ localStorage، موقعیت پیش‌فرض حفظ می‌شود */ }

  let pressed = false;
  let dragging = false;
  let startX = 0, startY = 0, startLeft = 0, startTop = 0;

  widget.addEventListener('pointerdown', (e) => {
    pressed = true;
    dragging = false;
    widget.setPointerCapture(e.pointerId);
    const rect = widget.getBoundingClientRect();
    startX = e.clientX;
    startY = e.clientY;
    startLeft = rect.left;
    startTop = rect.top;
  });

  widget.addEventListener('pointermove', (e) => {
    // نشانگرِ لیوان فقط برای موس دنبال‌کننده‌ی اشاره‌گر است (برای لمسی معنا ندارد)
    if (e.pointerType === 'mouse' && !dragging) {
      moveWaterCursorTo(e.clientX, e.clientY);
    }

    if (!pressed) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    if (!dragging && Math.hypot(dx, dy) > DRAG_THRESHOLD) {
      dragging = true;
      widget.classList.add('dragging');
      widget.style.cursor = 'grabbing';
      if (cursor) cursor.classList.remove('visible');
    }
    if (dragging) {
      applyPlantPosition(startLeft + dx, startTop + dy);
    }
  });

  function endPress(e) {
    if (!pressed) return;
    pressed = false;

    if (dragging) {
      dragging = false;
      widget.classList.remove('dragging');
      const rect = widget.getBoundingClientRect();
      try {
        localStorage.setItem(plantPositionStorageKey(), JSON.stringify({ left: rect.left, top: rect.top, v: PLANT_POSITION_VERSION }));
      } catch (err) { /* بی‌اهمیت */ }
      if (e && e.pointerType === 'mouse' && cursor) {
        cursor.classList.add('visible');
        widget.style.cursor = 'none';
      }
    } else {
      // حرکت به‌اندازه‌ی کافی نبوده: این یک کلیک برای آب‌دادن است
      waterPlantOnce();
    }
  }
  widget.addEventListener('pointerup', endPress);
  widget.addEventListener('pointercancel', () => { pressed = false; dragging = false; widget.classList.remove('dragging'); });

  if (cursor) {
    widget.addEventListener('pointerenter', (e) => {
      if (e.pointerType === 'mouse') {
        cursor.classList.add('visible');
        widget.style.cursor = 'none';
      }
    });
    widget.addEventListener('pointerleave', () => {
      cursor.classList.remove('visible');
      widget.style.cursor = 'grab';
    });
  }

  // اگر با تغییر اندازه‌ی پنجره گلدون بیرون از صفحه بیفتد، دوباره داخل محدوده می‌آید
  window.addEventListener('resize', () => {
    const rect = widget.getBoundingClientRect();
    applyPlantPosition(rect.left, rect.top);
  });
}

let teamBugsFlat = [];
let supervisorBugsFlat = [];
let lastBugsKeys = [];
let lastRenderedBugsKeysStr = '';

function bugKey(r) {
  return `${r.check_date_sort}_${r.order_number}_${r.kind_of_bug}`;
}

function isBugsTabActive() {
  const panel = document.getElementById('panel-bugs');
  return !!(panel && panel.classList.contains('active'));
}

function bugsSeenStorageKey() {
  return `bugs_seen_${currentUserId || 'guest'}`;
}

function markBugsSeen(keys) {
  try { localStorage.setItem(bugsSeenStorageKey(), JSON.stringify(keys || [])); } catch (e) { /* بی‌خیال، فقط نشونگر کار نمی‌کنه */ }
  document.querySelectorAll('.bugs-dot').forEach(dot => { dot.style.display = 'none'; });
}

function updateBugsNotification(currentKeys) {
  lastBugsKeys = currentKeys;
  let stored = null;
  try {
    const raw = localStorage.getItem(bugsSeenStorageKey());
    stored = raw ? JSON.parse(raw) : null;
  } catch (e) { stored = null; }

  // اگر کاربر همین الان روی تب خطاهاست، همه چیز دیده‌شده حساب می‌شود
  if (isBugsTabActive()) {
    markBugsSeen(currentKeys);
    return;
  }

  // اولین باری که این ویجت اجرا می‌شود، فقط وضعیت فعلی را به‌عنوان مبنا ذخیره کن (بدون نمایش نقطه)
  if (stored === null) {
    markBugsSeen(currentKeys);
    return;
  }

  const hasNew = currentKeys.some(k => !stored.includes(k));
  document.querySelectorAll('.bugs-dot').forEach(dot => { dot.style.display = hasNew ? 'inline-block' : 'none'; });
}

async function loadBugs(userId) {
  const container = document.getElementById('bugs-list');
  const { data, error } = await supabaseClient
    .from(TABLE_BUGS)
    .select('*')
    .eq('user_id', userId)
    .order('check_date_sort', { ascending: false });

  if (error) {
    // در صورت خطای موقت شبکه، وضعیت فعلی لیست/نقطه را دست‌نخورده نگه می‌داریم
    if (!lastRenderedBugsKeysStr) {
      container.innerHTML = `<div class="empty-state">خطا در دریافت اطلاعات: ${error.message}</div>`;
    }
    return;
  }
  if (!data || data.length === 0) {
    container.innerHTML = '<div class="empty-state">خطایی برای شما ثبت نشده است</div>';
    updateBugsNotification([]);
    lastRenderedBugsKeysStr = '[]';
    return;
  }

  const keys = data.map(bugKey);
  const keysStr = JSON.stringify(keys);

  // فقط وقتی چیزی واقعاً تغییر کرده دوباره رندر کن (برای جلوگیری از پرش لیست هنگام poll دوره‌ای)
  if (keysStr !== lastRenderedBugsKeysStr) {
    container.innerHTML = data.map(r => `
      <div class="bug-item">
        <div class="bug-top">
          <span class="bug-kind">${r.kind_of_bug ?? ''}</span>
          <span class="bug-date">${toJalaliDisplay(r.check_date_jalali)}</span>
        </div>
        <div class="bug-order">شماره سفارش: ${r.order_number ?? '—'}</div>
        ${r.description ? `<div class="bug-desc">${r.description}</div>` : ''}
        ${r.price_rial ? `<span class="bug-price">${Number(r.price_rial).toLocaleString('en-US')} ریال</span>` : ''}
      </div>
    `).join('');
    lastRenderedBugsKeysStr = keysStr;
  }

  updateBugsNotification(keys);
}

// اگر کاربر قبلاً لاگین کرده و نشست (session) هنوز معتبر است، مستقیم وارد داشبورد شود
(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) enterApp(session.user);
})();

/* بررسی دوره‌ای خطاهای جدید (فقط سمت کلاینت، بدون هیچ تغییری در بک‌اند)
   هر ۴۵ ثانیه یک‌بار همون جدول bug_reports دوباره خونده می‌شه و اگر
   خطای جدیدی نسبت به آخرین باری که کاربر تب «خطاها» رو باز کرده وجود داشته باشه،
   نقطه‌ی قرمز چشمک‌زن کنار تب نمایش داده می‌شه */
setInterval(() => {
  if (currentUserId && document.visibilityState === 'visible') {
    loadBugs(currentUserId);
  }
}, 45000);

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && currentUserId) {
    loadBugs(currentUserId);
  }
});
</script>
