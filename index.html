<style>
  /* =========================================================
     پیکربندی — این سه مقدار را با اطلاعات پروژه Supabase خودتان جایگزین کنید
     ========================================================= */
  :root {
    --bg: #EEF4FB;
    --surface: #FFFFFF;
    --surface-tint: #F6FAFE;
    --ink: #0F1B33;
    --ink-soft: #5A6B8C;
    --ink-faint: #A2AFC7;
    --line: #E1E9F5;
    --accent: #17A9FF;
    --accent-deep: #1656F5;
    --accent-soft: #E7F4FF;
    --accent-strong: #0D6FCB;
    --danger: #E0453F;
    --danger-soft: #FCEBEA;
    --success: #1FA971;
    --success-soft: #E6F7EF;
    --amber: #E08A17;
    --amber-soft: #FBF0DF;
    --violet: #7C5CE0;
    --violet-soft: #EFEAFC;
    --radius-lg: 20px;
    --radius: 14px;
    --radius-sm: 9px;
    --shadow-card: 0 1px 2px rgba(15,27,51,.04), 0 10px 30px -18px rgba(15,27,51,.18);
    --shadow-float: 0 24px 60px -20px rgba(22,86,245,.28), 0 4px 14px rgba(15,27,51,.06);
    --font: 'Vazirmatn', Tahoma, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font);
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }

  /* ---------- زمینه‌ی تزئینی ---------- */
  .bg-glow {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(560px 420px at 18% -6%, rgba(23,169,255,.20), transparent 60%),
      radial-gradient(620px 480px at 108% 12%, rgba(22,86,245,.14), transparent 60%),
      radial-gradient(700px 520px at 50% 118%, rgba(23,169,255,.10), transparent 60%);
  }

  .center-screen {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  /* ---------- صفحه ورود ---------- */
  .login-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 44px 36px 36px;
    width: 100%;
    max-width: 380px;
    box-shadow: var(--shadow-float);
    text-align: center;
    animation: rise .5s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .login-logo {
    display: flex;
    justify-content: center;
    margin-bottom: 22px;
  }
  .login-logo img {
    height: 46px;
    width: auto;
  }
  .login-card h1 {
    font-size: 19px;
    font-weight: 700;
    margin: 0 0 6px;
    letter-spacing: -.01em;
  }
  .login-card p.sub {
    font-size: 13.5px;
    color: var(--ink-soft);
    margin: 0 0 28px;
  }
  label {
    display: block;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--ink-soft);
    margin-bottom: 7px;
    text-align: right;
  }
  .field { margin-bottom: 16px; text-align: right; }
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--line);
    background: var(--surface-tint);
    font-family: var(--font);
    font-size: 14px;
    color: var(--ink);
    outline: none;
    transition: border-color .15s, background .15s, box-shadow .15s;
  }
  input[type="text"]:focus, input[type="password"]:focus {
    border-color: var(--accent);
    background: var(--surface);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }
  button { font-family: var(--font); cursor: pointer; }
  .btn-primary {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: var(--radius-sm);
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%);
    color: #fff;
    font-size: 14.5px;
    font-weight: 700;
    margin-top: 8px;
    box-shadow: 0 10px 24px -10px rgba(22,86,245,.55);
    transition: transform .15s, box-shadow .15s, filter .15s;
  }
  .btn-primary:hover { filter: brightness(1.06); transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { background: var(--ink-faint); box-shadow: none; cursor: default; transform: none; }
  .error-msg {
    background: var(--danger-soft);
    color: var(--danger);
    font-size: 13px;
    font-weight: 500;
    padding: 11px 13px;
    border-radius: var(--radius-sm);
    margin-bottom: 16px;
    display: none;
    text-align: right;
  }

  /* ---------- داشبورد ---------- */
  #app-screen { display: none; position: relative; z-index: 1; }
  .topbar-wrap {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
  }
  header.topbar {
    background: rgba(255,255,255,.85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    padding: 14px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img { height: 26px; width: auto; }
  .who { font-size: 13px; color: var(--ink-soft); display: flex; align-items: center; gap: 16px; }
  .who .user-chip {
    background: var(--accent-soft);
    color: var(--accent-strong);
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 12.5px;
  }
  .logout-link {
    background: none; border: none; color: var(--ink-soft);
    font-size: 13px; padding: 0;
    display: flex; align-items: center; gap: 5px;
    transition: color .15s;
  }
  .logout-link:hover { color: var(--danger); }

  main {
    max-width: 880px;
    margin: 0 auto;
    padding: 30px 20px 60px;
  }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--line);
  }
  .tab-btn {
    background: none; border: none;
    padding: 11px 6px;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-soft);
    font-family: var(--font);
    border-bottom: 2.5px solid transparent;
    margin-left: 26px;
    display: flex;
    align-items: center;
    gap: 7px;
    transition: color .15s, border-color .15s;
  }
  .tab-btn svg { width: 16px; height: 16px; opacity: .75; }
  .tab-btn.active { color: var(--accent-deep); border-bottom-color: var(--accent); font-weight: 700; }
  .tab-btn.active svg { opacity: 1; }

  .tab-dot {
    display: none;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--danger);
    margin-inline-start: 2px;
    animation: tab-dot-blink 1.1s ease-in-out infinite;
  }
  @keyframes tab-dot-blink {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(224,69,63,.55); }
    50% { opacity: .35; box-shadow: 0 0 0 4px rgba(224,69,63,0); }
  }

  .panel { display: none; animation: fadein .35s ease; }
  .panel.active { display: block; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

  .period-label {
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .header-accent-bar {
    position: relative;
    z-index: 1;
    height: 10px;
    margin: 8px 18px 0;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent-deep) 0%, var(--accent) 100%);
  }
  .last-update-bar {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: center;
    padding: 14px 16px 0;
  }
  .last-update-card {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 16px;
    box-shadow: var(--shadow-card);
    font-size: 12px;
    font-weight: 600;
    color: var(--ink);
  }
  .last-update-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--danger);
    flex-shrink: 0;
    animation: last-update-blink 1.2s ease-in-out infinite;
  }
  @keyframes last-update-blink {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(224,69,63,.55); }
    50% { opacity: .35; box-shadow: 0 0 0 4px rgba(224,69,63,0); }
  }

  .summary-row {
    display: flex;
    gap: 14px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .summary-card {
    background: linear-gradient(135deg, var(--accent-deep) 0%, var(--accent) 100%);
    border-radius: var(--radius-lg);
    padding: 20px 22px;
    flex: 1;
    min-width: 160px;
    box-shadow: 0 16px 34px -16px rgba(22,86,245,.5);
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .summary-card::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(140px 140px at 90% 0%, rgba(255,255,255,.25), transparent 70%);
  }
  .summary-card .label { font-size: 16px; color: rgba(255,255,255,.9); margin-bottom: 0; font-weight: 700; position: relative; }
  .summary-card .value { font-size: 30px; font-weight: 800; color: #fff; letter-spacing: -.01em; position: relative; }

  .list-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow-card);
  }
  .row-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px 20px;
    border-bottom: 1px solid var(--line);
    gap: 12px;
    transition: background .12s;
  }
  .row-item:hover { background: var(--surface-tint); }
  .row-item:last-child { border-bottom: none; }
  .row-date { font-size: 13.5px; color: var(--ink-soft); min-width: 92px; font-weight: 500; }
  .row-main { flex: 1; font-size: 14px; }
  .row-badge {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--accent-strong);
    background: var(--accent-soft);
    padding: 4px 12px;
    border-radius: 999px;
    white-space: nowrap;
    min-width: 44px;
    text-align: center;
  }

  .bug-item { padding: 17px 20px; border-bottom: 1px solid var(--line); transition: background .12s; }
  .bug-item:hover { background: var(--surface-tint); }
  .bug-item:last-child { border-bottom: none; }
  .bug-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; gap: 10px; flex-wrap: wrap; }
  .bug-kind { font-size: 14px; font-weight: 700; }
  .bug-date { font-size: 12px; color: var(--ink-faint); font-weight: 500; }
  .bug-order { font-size: 13px; color: var(--ink-soft); margin-bottom: 7px; }
  .bug-desc { font-size: 13.5px; color: var(--ink); line-height: 1.85; margin-bottom: 9px; }
  .bug-price {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    color: var(--danger);
    background: var(--danger-soft);
    padding: 4px 11px;
    border-radius: 999px;
  }

  /* ---------- گزارش کارشناسان تیکت (بازه‌ی ثابت ۲۳ تا ۲۲) ---------- */
  .ticket-primary-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    background: linear-gradient(135deg, var(--accent-deep) 0%, var(--accent) 100%);
    border-radius: var(--radius-lg);
    padding: 24px 26px;
    margin-bottom: 14px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 40px -18px rgba(22,86,245,.5);
  }
  .ticket-primary-card::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(180px 180px at 92% -10%, rgba(255,255,255,.28), transparent 70%);
  }
  .ticket-primary-icon {
    position: relative;
    flex-shrink: 0;
    width: 54px;
    height: 54px;
    border-radius: 16px;
    background: rgba(255,255,255,.18);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ticket-primary-icon svg { width: 28px; height: 28px; stroke: #fff; }
  .ticket-primary-card .label { font-size: 16px; color: rgba(255,255,255,.9); font-weight: 700; position: relative; }
  .ticket-primary-card .value { font-size: 30px; font-weight: 800; color: #fff; letter-spacing: -.01em; position: relative; }

  .ticket-avg-response-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: linear-gradient(135deg, #6FB6F2 0%, #BFE0FC 100%);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 14px;
    box-shadow: 0 12px 26px -14px rgba(23,169,255,.4);
  }
  .ticket-avg-response-card .label { font-size: 13px; color: var(--ink); font-weight: 700; }
  .ticket-avg-response-card .value { font-size: 18px; font-weight: 800; color: var(--ink); letter-spacing: -.01em; }

  .ticket-hero-row {
    display: flex;
    gap: 14px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .ticket-hero-card {
    flex: 1;
    min-width: 150px;
    border-radius: var(--radius-lg);
    padding: 20px 22px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 16px 34px -16px rgba(22,86,245,.45);
  }
  .ticket-hero-card::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(140px 140px at 88% 0%, rgba(255,255,255,.25), transparent 70%);
  }
  .ticket-hero-card.count { background: linear-gradient(135deg, var(--accent-deep) 0%, var(--accent) 100%); }
  .ticket-hero-card.money { background: linear-gradient(135deg, #6FB6F2 0%, #A9D4FA 100%); box-shadow: 0 16px 34px -16px rgba(22,86,245,.28); }
  .ticket-hero-card.money .label, .ticket-hero-card.money .value { color: var(--ink); }
  .ticket-hero-card.bonus { background: linear-gradient(135deg, var(--violet) 0%, #B7A6F2 100%); box-shadow: 0 16px 34px -16px rgba(124,92,224,.4); }
  .ticket-hero-card.bonus .label, .ticket-hero-card.bonus .value { color: var(--ink); }
  .ticket-hero-card.bonus .hint { font-size: 11.5px; color: #fff; margin-top: 6px; position: relative; }
  .ticket-hero-card .label { font-size: 13.5px; color: rgba(255,255,255,.88); font-weight: 700; margin-bottom: 8px; position: relative; }
  .ticket-hero-card .value { font-size: 26px; font-weight: 800; color: #fff; letter-spacing: -.01em; position: relative; }

  .ticket-report-item { padding: 22px; }
  .ticket-report-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--accent-strong);
    background: var(--accent-soft);
    display: inline-block;
    padding: 5px 14px;
    border-radius: 999px;
    margin-bottom: 16px;
  }
  .ticket-report-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .ticket-report-cell {
    display: flex;
    align-items: center;
    gap: 12px;
    border-radius: var(--radius-sm);
    padding: 13px 15px;
  }
  .ticket-report-cell .icon {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ticket-report-cell .icon svg { width: 19px; height: 19px; }
  .ticket-report-cell .kv { flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .ticket-report-cell .k { font-size: 13px; font-weight: 600; opacity: .8; }
  .ticket-report-cell .v { font-size: 17px; font-weight: 800; }
  .ticket-report-cell.normal { background: var(--accent-soft); }
  .ticket-report-cell.normal .icon { background: rgba(23,169,255,.18); }
  .ticket-report-cell.normal .k, .ticket-report-cell.normal .v, .ticket-report-cell.normal .icon svg { color: var(--accent-strong); stroke: var(--accent-strong); }
  .ticket-report-cell.off { background: var(--amber-soft); }
  .ticket-report-cell.off .icon { background: rgba(224,138,23,.18); }
  .ticket-report-cell.off .k, .ticket-report-cell.off .v, .ticket-report-cell.off .icon svg { color: var(--amber); stroke: var(--amber); }
  .ticket-report-cell.count { background: var(--violet-soft); }
  .ticket-report-cell.count .icon { background: rgba(124,92,224,.18); }
  .ticket-report-cell.count .k, .ticket-report-cell.count .v, .ticket-report-cell.count .icon svg { color: var(--violet); stroke: var(--violet); }

  /* ---------- نسخه‌ی جمع‌وجورترِ کارت‌های گزارش کارشناس تیکت، مخصوص دیتیل بازشونده‌ی هر نفر
       در تب «کارشناسان تیکت» نمای سرگروه ---------- */
  .team-details-inner .ticket-primary-card {
    padding: 14px 16px;
    margin-bottom: 10px;
    border-radius: var(--radius);
  }
  .team-details-inner .ticket-primary-card .label { font-size: 12.5px; }
  .team-details-inner .ticket-primary-card .value { font-size: 19px; }
  .team-details-inner .ticket-avg-response-card { padding: 10px 14px; margin-bottom: 10px; }
  .team-details-inner .ticket-avg-response-card .label { font-size: 11.5px; }
  .team-details-inner .ticket-avg-response-card .value { font-size: 15px; }
  .team-details-inner .ticket-hero-row { gap: 10px; margin-bottom: 10px; }
  .team-details-inner .ticket-hero-card { padding: 12px 14px; border-radius: var(--radius); min-width: 120px; }
  .team-details-inner .ticket-hero-card .label { font-size: 11.5px; margin-bottom: 4px; }
  .team-details-inner .ticket-hero-card .value { font-size: 17px; }
  .team-details-inner .ticket-hero-card .hint { font-size: 10px; margin-top: 4px; }
  .team-details-inner .ticket-report-item { padding: 12px 14px; }
  .team-details-inner .ticket-report-title { font-size: 12px; padding: 3px 11px; margin-bottom: 10px; }
  .team-details-inner .ticket-report-grid { gap: 7px; }
  .team-details-inner .ticket-report-cell { padding: 9px 11px; gap: 9px; }
  .team-details-inner .ticket-report-cell .icon { width: 26px; height: 26px; }
  .team-details-inner .ticket-report-cell .icon svg { width: 15px; height: 15px; }
  .team-details-inner .ticket-report-cell .k { font-size: 12px; }
  .team-details-inner .ticket-report-cell .v { font-size: 14px; }

  .empty-state {
    padding: 52px 20px;
    text-align: center;
    color: var(--ink-faint);
    font-size: 14px;
  }
  .empty-state svg { width: 40px; height: 40px; margin-bottom: 12px; opacity: .5; }
  .loading-state {
    padding: 46px 20px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
  }

  /* ---------- نمای سرگروه: لیست کشویی نیروها ---------- */
  .team-item { border-bottom: 1px solid var(--line); }
  .team-item:last-child { border-bottom: none; }
  .team-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 20px;
    cursor: pointer;
    transition: background .12s;
    background: none;
    border: none;
    width: 100%;
    text-align: right;
    font-family: var(--font);
  }
  .team-header:hover { background: var(--surface-tint); }
  .team-name-wrap { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .team-chevron {
    width: 16px; height: 16px; flex-shrink: 0;
    color: var(--ink-faint);
    transition: transform .2s ease;
  }
  .team-item.open .team-chevron { transform: rotate(180deg); color: var(--accent-deep); }
  .team-name { font-size: 14.5px; font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .team-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .team-total {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--accent-strong);
    background: var(--accent-soft);
    padding: 4px 8px;
    border-radius: 999px;
    white-space: nowrap;
    width: 64px;
    text-align: center;
    box-sizing: border-box;
    font-variant-numeric: tabular-nums;
  }
  .team-details {
    max-height: 0;
    overflow: hidden;
    transition: max-height .25s ease;
    background: var(--surface-tint);
  }
  .team-item.open .team-details { max-height: 2400px; }
  .team-details-inner { padding: 4px 20px 14px; }
  .team-day-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 4px;
    border-bottom: 1px dashed var(--line);
    font-size: 13px;
  }
  .team-day-row:last-child { border-bottom: none; }
  .team-day-date { color: var(--ink-soft); font-weight: 500; }
  .team-day-badge {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink-soft);
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 3px 10px;
    border-radius: 999px;
    min-width: 40px;
    text-align: center;
  }
  .team-empty-days { padding: 14px 4px; font-size: 12.5px; color: var(--ink-faint); text-align: center; }
  .team-bug-total {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--danger);
    background: var(--danger-soft);
    padding: 4px 8px;
    border-radius: 999px;
    white-space: nowrap;
    width: 56px;
    text-align: center;
    box-sizing: border-box;
    font-variant-numeric: tabular-nums;
  }
  .team-section-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-faint);
    margin: 14px 4px 6px;
  }
  .team-bugs-search-wrap { margin-bottom: 14px; }
  .team-bugs-search {
    width: 100%;
    box-sizing: border-box;
    padding: 11px 16px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-family: var(--font);
    font-size: 14px;
    outline: none;
    transition: border-color .15s;
  }
  .team-bugs-search:focus { border-color: var(--accent); }
  .team-bugs-search::placeholder { color: var(--ink-faint); }
  .team-details-inner .bug-item { padding: 12px 4px; }
  .team-details-inner .bug-item:hover { background: none; }
  .bug-agent { font-size: 13px; font-weight: 700; color: var(--accent-deep); margin-bottom: 4px; }

  /* ---------- نمای سرگروه: بررسی عملکرد (نفرات زیر میانگین تیم) ---------- */
  .perf-below-badge {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--danger);
    background: var(--danger-soft);
    padding: 4px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .perf-day-badge-good {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--success);
    background: var(--success-soft);
    padding: 3px 10px;
    border-radius: 999px;
    min-width: 40px;
    text-align: center;
  }
  .perf-day-badge-missing {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--danger);
    background: var(--danger-soft);
    padding: 3px 10px;
    border-radius: 999px;
  }
  .perf-all-good {
    padding: 40px 20px;
    text-align: center;
    color: var(--success);
    font-size: 14px;
    font-weight: 600;
  }
  .perf-above-badge {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--success);
    background: var(--success-soft);
    padding: 4px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .perf-group-header {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 700;
    padding: 14px 20px 10px;
  }
  .perf-group-header.is-below { color: var(--danger); }
  .perf-group-header.is-above { color: var(--success); }
  .perf-group-count {
    font-size: 11.5px;
    font-weight: 700;
    padding: 2px 9px;
    border-radius: 999px;
  }
  .perf-group-header.is-below .perf-group-count { color: var(--danger); background: var(--danger-soft); }
  .perf-group-header.is-above .perf-group-count { color: var(--success); background: var(--success-soft); }
  .perf-group-empty { padding: 6px 20px 16px; font-size: 12.5px; color: var(--ink-faint); }
  .perf-group-divider { height: 1px; background: var(--line); margin: 4px 0; }

  /* ---------- نمای سوپروایزر: لیست کشویی سرگروه‌ها (و داخل هرکدام، لیست کشویی نفراتش) ---------- */
  .leader-item { border-bottom: 1px solid var(--line); }
  .leader-item:last-child { border-bottom: none; }
  .leader-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 17px 20px;
    cursor: pointer;
    transition: background .12s;
    background: var(--accent-soft);
    border: none;
    width: 100%;
    text-align: right;
    font-family: var(--font);
  }
  .leader-header:hover { background: #DCEFFF; }
  .leader-name-wrap { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .leader-chevron {
    width: 17px; height: 17px; flex-shrink: 0;
    color: var(--accent-strong);
    transition: transform .2s ease;
  }
  .leader-item.open > .leader-header .leader-chevron { transform: rotate(180deg); color: var(--accent-deep); }
  .leader-name { font-size: 15px; font-weight: 700; color: var(--accent-deep); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .leader-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .leader-total {
    font-size: 14px;
    font-weight: 800;
    color: #fff;
    background: var(--accent-deep);
    padding: 5px 10px;
    border-radius: 999px;
    white-space: nowrap;
    min-width: 64px;
    text-align: center;
    box-sizing: border-box;
    font-variant-numeric: tabular-nums;
  }
  .leader-bug-total {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--danger);
    background: var(--danger-soft);
    padding: 4px 8px;
    border-radius: 999px;
    white-space: nowrap;
    width: 56px;
    text-align: center;
    box-sizing: border-box;
    font-variant-numeric: tabular-nums;
  }
  .leader-details {
    max-height: 0;
    overflow: hidden;
    transition: max-height .3s ease;
    background: var(--bg);
  }
  .leader-item.open > .leader-details { max-height: 4000px; }
  .leader-details-inner { padding: 12px 14px 16px; }


  /* ---------- ویجت باغچه (بدون کادر/متن/دکمه — فقط گلدون قابل جابجایی) ---------- */
  .plant-widget {
    position: fixed;
    left: 22px;
    bottom: 26px;
    z-index: 40;
    width: 176px;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    cursor: grab;
  }
  .plant-widget.dragging { cursor: grabbing; }

  .flower-frame {
    width: 176px;
    height: 210px;
    overflow: hidden;
    container-type: size;
    container-name: flowerbox;
    pointer-events: none; /* درگ از روی خودِ ویجت انجام می‌شود، نه المان‌های داخلی */
  }
  /* صحنه بدون پس‌زمینه/کادر رندر می‌شود؛ فقط گل‌ها روی زمینه‌ی صفحه دیده می‌شوند */
  .flower-scene { background: transparent !important; }
  .flower-scene .night { display: none; }
  .flower-scene.watering-flash .flowers { filter: drop-shadow(0 0 8px rgba(107,240,255,.9)) drop-shadow(0 0 16px rgba(107,240,255,.4)); }

  /* گلدون سفالی زیر گل‌ها؛ پشت گل‌ها و پشت اکثر تزئینات چمنی قرار می‌گیرد */
  .flower-scene .flower-pot {
    position: absolute;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: 80cqmin;
    z-index: -1;
    pointer-events: none;
    filter: drop-shadow(0 3px 4px rgba(15,27,51,.18));
  }
  .flower-scene .flower-pot svg {
    display: block;
    width: 100%;
    height: auto;
    /* گلدون کمی بلندتر: از پایین ثابت می‌ماند و فقط به سمت بالا کشیده می‌شود */
    transform: scaleY(1.4);
    transform-origin: bottom center;
  }

  @media (max-width: 760px) {
    .plant-widget { left: 10px; bottom: 10px; width: 132px; }
    .flower-frame { width: 132px; height: 158px; }
  }

  /* ---------- نشانگر لیوان آب (به‌جای موس، وقتی روی گلدون است) ---------- */
  .water-cursor {
    position: fixed;
    top: 0; left: 0;
    z-index: 1000;
    pointer-events: none;
    transform: translate(var(--wc-x, -1000px), var(--wc-y, -1000px)) rotate(0deg);
    transform-origin: 78% 12%;
    transition: transform .16s ease-out;
    display: none;
    filter: drop-shadow(0 3px 6px rgba(15,27,51,.28));
  }
  .water-cursor.visible { display: block; }
  .water-cursor .wc-liquid { transition: opacity .2s ease, height .2s ease; }
  .water-cursor.is-empty .wc-liquid { opacity: 0; }
  .water-cursor.pouring {
    transition: transform .22s cubic-bezier(.32,.64,.3,1);
    transform: translate(var(--wc-x, -1000px), var(--wc-y, -1000px)) rotate(58deg);
  }
  .water-cursor.shake { animation: wc-shake .32s ease; }
  @keyframes wc-shake {
    0%, 100% { transform: translate(var(--wc-x, -1000px), var(--wc-y, -1000px)) rotate(0deg); }
    30% { transform: translate(var(--wc-x, -1000px), var(--wc-y, -1000px)) rotate(-14deg); }
    70% { transform: translate(var(--wc-x, -1000px), var(--wc-y, -1000px)) rotate(11deg); }
  }

  /* ---------- صحنه‌ی شب‌گل‌های درخشان (باغچه) ---------- */

function toJalaliDisplay(jalaliText) {
  // تاریخ‌ها از قبل به‌صورت شمسی (مثلا 1405/05/24) در دیتابیس ذخیره شده‌اند، نیازی به تبدیل نیست
  return jalaliText || '—';
}

// عدد را با حداکثر یک رقم اعشار، تمیز و بدون خطاهای اعشاری float نمایش می‌دهد
// مثال: 66.79999999999998 -> «۶۶.۸» (جداکننده‌ی اعشار به‌جای ٫ فارسی، همون نقطه‌ی معمولیه)
function formatNumber(n) {
  const num = Number(n) || 0;
  const rounded = Math.round(num * 10) / 10;
  return rounded.toLocaleString('fa-IR', { maximumFractionDigits: 1, minimumFractionDigits: 0 }).replace(/٫/g, '.');
}

function pad2(n) { return String(n).padStart(2, '0'); }

// همان الگوریتم تبدیل میلادی به شمسی که در ورک‌فلوی n8n استفاده شده
function gregorianToJalali(gy, gm, gd) {
  const g_d_m = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
  let jy;
  if (gy > 1600) { jy = 979; gy -= 1600; } else { jy = 0; gy -= 621; }
  const gy2 = (gm > 2) ? (gy + 1) : gy;
  let days = (365 * gy) + (Math.floor((gy2 + 3) / 4)) - (Math.floor((gy2 + 99) / 100)) + (Math.floor((gy2 + 399) / 400)) - 80 + gd + g_d_m[gm - 1];
  jy += 33 * Math.floor(days / 12053);
  days %= 12053;
  jy += 4 * Math.floor(days / 1461);
  days %= 1461;
  if (days > 365) {
    jy += Math.floor((days - 1) / 365);
    days = (days - 1) % 365;
  }
  let jm, jd;
  if (days < 186) {
    jm = 1 + Math.floor(days / 31);
    jd = 1 + (days % 31);
  } else {
    jm = 7 + Math.floor((days - 186) / 30);
    jd = 1 + ((days - 186) % 30);
  }
  return [jy, jm, jd];
}

function tehranTodayJalali() {
  const fmt = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tehran', year: 'numeric', month: '2-digit', day: '2-digit' });
  const [gy, gm, gd] = fmt.format(new Date()).split('-').map(Number);
  return gregorianToJalali(gy, gm, gd);
}

// بازه‌ی جاری: از بیست‌وسوم یک ماه شمسی تا بیست‌ودوم ماه بعد
// (همان منطق محاسبه‌ی بازه‌ای که در ورک‌فلوی «ارسال تارگت تیکت + پاداش» استفاده شده)
function currentPeriodBounds() {
  const [jy, jm, jd] = tehranTodayJalali();
  let startJy, startJm, endJy, endJm;
  if (jd >= 23) {
    startJy = jy; startJm = jm;
    endJy = (jm < 12) ? jy : jy + 1;
    endJm = (jm < 12) ? jm + 1 : 1;
  } else {
    startJy = (jm > 1) ? jy : jy - 1;
    startJm = (jm > 1) ? jm - 1 : 12;
    endJy = jy; endJm = jm;
  }
  return {
    startSort: startJy * 10000 + startJm * 100 + 23,
    endSort: endJy * 10000 + endJm * 100 + 22,
    startLabel: `${startJy}/${pad2(startJm)}/23`,
    endLabel: `${endJy}/${pad2(endJm)}/22`
  };
}

/* =========================================================

   - بازه‌ی گزارش ثابته (همون بازه‌ی جاری ۲۳ تا ۲۲ که کل برنامه استفاده می‌کنه)
   - این گزارش هر بار که ورک‌فلوی n8n اجرا می‌شه، برای کل بازه دوباره از متابیس
     گرفته و روی همون ردیفِ user_id در جدول ticket_agent_report آپدیت می‌شه
     (یعنی هر کارشناس فقط یک ردیف داره که همیشه مقدار تازه‌ی کل بازه رو نشون می‌ده)
   - چون تعداد ردیف‌ها کمه، نیازی به خروجی اکسل نیست و همه‌ی ستون‌ها همینجا نمایش داده می‌شن
   ========================================================= */
// ساخت بلوک‌های HTML گزارش کارشناس تیکت (کارت تارگت، هیرو مبلغ+پاداش، جزئیات هر رشته)
// از این تابع هم در نمای شخصیِ خود کارشناس تیکت و هم در دیتیل نمای سرگروه استفاده می‌شود
// تا دقیقاً همان خروجی و محاسبات در هر دو جا یکسان باشد
function buildTicketAgentReportBlocks(data) {
  const ticketTotal = data.reduce((sum, r) => sum + (Number(r.ticket_count) || 0), 0);
  const pointsTotal = data.reduce((sum, r) => sum + (Number(r.total_points) || 0), 0);
  const paymentTotal = data.reduce((sum, r) => sum + (Number(r.total_payment_rials) || 0), 0);

  /* اگر کارشناس بیش از یک رشته (insure_types) داشته باشه (مثلاً هم «بدنه» هم «ثالث»)،
     هم مجموع تارگت و هم پله‌ی پاداش باید جدا جدا برای هر رشته حساب و نمایش داده بشه */
  const groupsMap = new Map();
  data.forEach(r => {
    const key = r.insure_types || 'سایر';
    const g = groupsMap.get(key) || { points: 0 };
    g.points += Number(r.total_points) || 0;
    groupsMap.set(key, g);
  });

  // «مجموع تارگت» مهم‌ترین عدد این گزارشه، برای همین جدا و بزرگ‌تر از بقیه نمایش داده می‌شه؛
  // اگر بیش از یک رشته وجود داشته باشه، به همین شکل یک کارت دیگه برای رشته‌ی دوم زیرش اضافه می‌شه
  let primaryHtml;
  if (groupsMap.size <= 1) {
    primaryHtml = `
      <div class="ticket-primary-card">
        <div class="label">مجموع تارگت</div>
        <div class="value">${formatNumber(pointsTotal)}</div>
      </div>
    `;
  } else {
    primaryHtml = Array.from(groupsMap.entries()).map(([insureType, g]) => `
      <div class="ticket-primary-card">
        <div class="label">مجموع تارگت — ${insureType}</div>
        <div class="value">${formatNumber(g.points)}</div>
      </div>
    `).join('');
  }

  // میانگین زمان پاسخگویی به تیکت (ستون avg_response_hours، از گزارش جدید متابیس)
  // این عدد مستقل از رشته‌ی بیمه‌ست، برای همین فقط یک‌بار زیر «مجموع تارگت» نمایش داده می‌شه
  const avgResponseRow = data.find(r => r.avg_response_hours !== null && r.avg_response_hours !== undefined);
  const avgResponseHtml = avgResponseRow ? `
    <div class="ticket-avg-response-card">
      <div class="label">میانگین زمان پاسخگویی به تیکت</div>
      <div class="value">${formatNumber(avgResponseRow.avg_response_hours)} ساعت</div>
    </div>
  ` : '';
  primaryHtml += avgResponseHtml;

  let bonusAmount = 0;
  const bonusHints = [];
  groupsMap.forEach((g, insureType) => {
    const tiers = tierTableForInsureType(insureType);
    const reached = ticketBonusForTotal(g.points, tiers);
    const next = nextTicketBonusTier(g.points, tiers);
    bonusAmount += reached ? reached.amount : 0;
    const line = next
      ? `${insureType} — تا پاداش بعدی (${formatNumber(next.tickets)} تیکت): ${formatNumber(next.tickets - g.points)} تیکت مانده`
      : (reached ? `${insureType} — به بالاترین پله پاداش رسیدید` : `${insureType} — اولین پله در ${formatNumber(tiers[0].tickets)} تیکت`);
    bonusHints.push(line);
  });
  const totalWithBonus = Math.round(paymentTotal) + bonusAmount;
  const bonusHint = bonusHints.join('<br>');

  const heroHtml = `
    <div class="ticket-hero-card money">
      <div class="label">مبلغ قابل پرداخت (ریال)</div>
      <div class="value">${Math.round(paymentTotal).toLocaleString('en-US')}</div>
    </div>
    <div class="ticket-hero-card bonus">
      <div class="label">مبلغ پرداختی + پاداش (ریال)</div>
      <div class="value">${totalWithBonus.toLocaleString('en-US')}</div>
      <div class="hint">${bonusHint}</div>
    </div>
  `;

  const itemsHtml = data.map(r => `
    <div class="ticket-report-item">
      ${r.insure_types ? `<div class="ticket-report-title">${r.insure_types}</div>` : ''}
      <div class="ticket-report-grid">
        <div class="ticket-report-cell normal">
          <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg></div>
          <div class="kv">
            <span class="k">تیکت روزهای عادی</span>
            <span class="v">${formatNumber(r.normal_days_tickets)}</span>
          </div>
        </div>
        <div class="ticket-report-cell off">
          <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg></div>
          <div class="kv">
            <span class="k">تیکت روزهای تعطیل</span>
            <span class="v">${formatNumber(r.off_days_tickets)}</span>
          </div>
        </div>
        <div class="ticket-report-cell count">
          <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8a4 4 0 0 1 4 4v4a4 4 0 0 1-8 0v-4a4 4 0 0 1 4-4Z"/><path d="M8 12H4M20 12h-4M12 8V4"/></svg></div>
          <div class="kv">
            <span class="k">تعداد کل تیکت های بررسی شده</span>
            <span class="v">${formatNumber(r.ticket_count)}</span>
          </div>
        </div>
        ${r.discount_removal_count ? `
        <div class="ticket-report-cell count">
          <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg></div>
          <div class="kv">
            <span class="k">الحاقیه حذف تخفیفات</span>
            <span class="v">${formatNumber(r.discount_removal_count)}</span>
          </div>
        </div>
        ` : ''}
      </div>
    </div>
  `).join('');

  return { primaryHtml, heroHtml, itemsHtml, pointsTotal, ticketTotal, paymentTotal, totalWithBonus };
}

async function loadTicketAgentReport(userId) {
  const container = document.getElementById('ticket-agent-list');
  const labelEl = document.getElementById('ticket-agent-period-label');
  const primaryEl = document.getElementById('ticket-agent-primary');
  const heroEl = document.getElementById('ticket-agent-hero');

  const { data, error } = await supabaseClient
    .from(TABLE_TICKET_AGENT_REPORT)
    .select('*')
    .eq('user_id', userId);

  if (error) {
    primaryEl.innerHTML = '';
    heroEl.innerHTML = '';
    container.innerHTML = `<div class="empty-state">خطا در دریافت اطلاعات: ${error.message}</div>`;
    return;
  }
  if (!data || data.length === 0) {
    labelEl.textContent = '';
    primaryEl.innerHTML = '';
    heroEl.innerHTML = '';
    container.innerHTML = '<div class="empty-state">گزارشی برای شما ثبت نشده است</div>';
    currentPeriodKey = 'ticket-agent';
    updatePlantWidget(0);
    return;
  }

  const first = data[0];
  if (first.period_start_jalali && first.period_end_jalali) {
    labelEl.textContent = `بازه‌ی جاری: ${first.period_start_jalali} تا ${first.period_end_jalali}`;
  }
  currentPeriodKey = first.period_start_jalali || 'ticket-agent';

  const { primaryHtml, heroHtml, itemsHtml, ticketTotal } = buildTicketAgentReportBlocks(data);
  primaryEl.innerHTML = primaryHtml;
  heroEl.innerHTML = heroHtml;
  container.innerHTML = itemsHtml;

  // گلدون کارشناس تیکت بر اساس مجموعِ «تعداد کل تیکت» بازه‌ست: به‌ازای هر ۱۰ تیکت، ۱ لیوان آب
  const earnedCups = cupsForPeriodTotal(ticketTotal, TICKET_TARGETS_PER_BRANCH);
  updatePlantWidget(earnedCups);
}

async function enterApp(user) {
  loginScreen.style.display = 'none';
  appScreen.style.display = 'block';
  document.getElementById('user-label').textContent = user.email.split('@')[0];

  currentUserId = user.id;
  initPlantDrag();
  loadLastUpdate();

  // بررسی نقش کاربر: سوپروایزر، سرگروه یا نیروی عادی
  const { data: profile, error: profileError } = await supabaseClient
    .from(TABLE_PROFILES)
    .select('role, full_name')
    .eq('id', user.id)
    .single();

  const isSupervisor = !profileError && profile && profile.role === 'supervisor';
  const isLeader = !profileError && profile && profile.role === 'leader';
  const isTicketAgent = !profileError && profile && profile.role === 'ticket_agent';

  if (isTicketAgent) {
    // نمای کارشناس تیکت: گزارش بازه‌ی ثابت (۲۳ تا ۲۲) + تب خطاها
    document.getElementById('plant-widget').style.display = 'block';
    document.getElementById('main-tabs').style.display = 'none';
    document.getElementById('panel-targets').classList.remove('active');
    document.getElementById('panel-bugs').classList.remove('active');
    document.getElementById('team-tabs').style.display = 'none';
    document.getElementById('panel-team').classList.remove('active');
    document.getElementById('panel-team-bugs').classList.remove('active');
    document.getElementById('panel-team-performance').classList.remove('active');
    document.getElementById('panel-team-ticket-agents').classList.remove('active');
    document.getElementById('supervisor-tabs').style.display = 'none';
    document.getElementById('panel-supervisor').classList.remove('active');
    document.getElementById('panel-supervisor-bugs').classList.remove('active');
    document.getElementById('ticket-agent-tabs').style.display = 'flex';
    document.getElementById('panel-ticket-agent').classList.add('active');
    loadTicketAgentReport(user.id);
    loadBugs(user.id);
  } else if (isSupervisor) {
    // نمای سوپروایزر (سرپرست): تب‌ها و پنل‌های نیروی عادی و سرگروه مخفی، تب‌های سرگروه‌ها نمایش داده می‌شود
    // ویجت باغچه/گلدون برای این نقش نمایش داده نمی‌شود
    document.getElementById('plant-widget').style.display = 'none';
    document.getElementById('main-tabs').style.display = 'none';
    document.getElementById('panel-targets').classList.remove('active');
    document.getElementById('panel-bugs').classList.remove('active');
    document.getElementById('team-tabs').style.display = 'none';
    document.getElementById('panel-team').classList.remove('active');
    document.getElementById('panel-team-bugs').classList.remove('active');
    document.getElementById('panel-team-performance').classList.remove('active');
    document.getElementById('panel-team-ticket-agents').classList.remove('active');
    document.getElementById('supervisor-tabs').style.display = 'flex';
    document.getElementById('panel-supervisor').classList.add('active');
    document.getElementById('panel-supervisor-bugs').classList.remove('active');
    loadSupervisorView(user.id);
  } else if (isLeader) {
    // نمای سرگروه: تب‌ها و پنل‌های نیروی عادی مخفی، تب‌های تیم نمایش داده می‌شود
    // ویجت باغچه/گلدون برای این نقش نمایش داده نمی‌شود
    document.getElementById('plant-widget').style.display = 'none';
    document.getElementById('main-tabs').style.display = 'none';
    document.getElementById('panel-targets').classList.remove('active');
    document.getElementById('panel-bugs').classList.remove('active');
    document.getElementById('team-tabs').style.display = 'flex';
    document.getElementById('panel-team').classList.add('active');
    document.getElementById('panel-team-bugs').classList.remove('active');
    document.getElementById('panel-team-performance').classList.remove('active');
    document.getElementById('panel-team-ticket-agents').classList.remove('active');
    loadTeamView(user.id);
  } else {
    // نمای نیروی عادی: ویجت باغچه/گلدون نمایش داده می‌شود
    document.getElementById('plant-widget').style.display = 'block';
    loadTargets(user.id);
    loadBugs(user.id);
  }
}

/* =========================================================
   نمای سرگروه
   - نیروهای زیرمجموعه از جدول واسط team_assignments خوانده می‌شوند
     (هر نیرو می‌تواند زیرمجموعه‌ی چند سرگروه باشد)
   - تارگت هر نیرو در بازه‌ی جاری جمع زده می‌شود
   - کلیک روی هر نیرو، ریز تارگت روز به روزش را باز/بسته می‌کند
   ========================================================= */
// ساخت HTML لیست کشویی نفرات (هر نفر با کلیک، ریز تارگت روز به روزش باز/بسته می‌شود)
// هم در نمای سرگروه (لیست مستقیم نفرات) و هم در نمای سوپروایزر (داخل هر سرگروه) استفاده می‌شود
function buildMemberItemsHtml(membersWithTotals) {
  return membersWithTotals.map(({ m, myRows, myBugs, myTotal }) => {
    const displayName = m.full_name || m.backoffice_id || '—';

    const daysHtml = myRows.length
      ? myRows.map(r => `
          <div class="team-day-row">
            <span class="team-day-date">${toJalaliDisplay(r.report_date_jalali)}</span>
            <span class="team-day-badge">${r.target_count != null ? formatNumber(r.target_count) : '—'}</span>
          </div>
        `).join('')
      : '<div class="team-empty-days">هنوز تارگتی برای این بازه ثبت نشده است</div>';

    return `
      <div class="team-item" data-member="${m.id}">
        <button class="team-header" type="button">
          <div class="team-name-wrap">
            <svg class="team-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            <span class="team-name">${displayName}</span>
          </div>
          <div class="team-right">
            <span class="team-bug-total">${myBugs.length} خطا</span>
            <span class="team-total">${formatNumber(myTotal)}</span>
          </div>
        </button>
        <div class="team-details">
          <div class="team-details-inner">${daysHtml}</div>
        </div>
      </div>
    `;
  }).join('');
}

// فعال کردن باز/بسته شدن ردیف‌های نفرات (.team-item) و در صورت وجود، سرگروه‌ها (.leader-item) داخل یک ظرف
function bindExpandableToggles(container) {
  container.querySelectorAll('.leader-item').forEach(litem => {
    const header = litem.querySelector(':scope > .leader-header');
    if (header) {
      header.addEventListener('click', () => {
        litem.classList.toggle('open');
      });
    }
  });
  container.querySelectorAll('.team-item').forEach(item => {
    const header = item.querySelector('.team-header');
    if (header) {
      header.addEventListener('click', () => {
        item.classList.toggle('open');
      });
    }
  });
}

async function loadTeamView(leaderId) {
  const container = document.getElementById('team-list');
  const period = currentPeriodBounds();
  document.getElementById('team-period-label').textContent = `بازه‌ی جاری: ${period.startLabel} تا ${period.endLabel}`;

  // ۱) گرفتن id نیروهای زیرمجموعه‌ی این سرگروه از جدول واسط
  const { data: assignments, error: assignError } = await supabaseClient
    .from(TABLE_TEAM_ASSIGNMENTS)
    .select('member_id')
    .eq('leader_id', leaderId);

  if (assignError) {
    container.innerHTML = `<div class="empty-state">خطا در دریافت لیست نیروها: ${assignError.message}</div>`;
    document.getElementById('team-period-total').textContent = '—';
    return;
  }
  if (!assignments || assignments.length === 0) {
    container.innerHTML = '<div class="empty-state">هنوز نیرویی به شما اساین نشده است</div>';
    document.getElementById('team-period-total').textContent = '۰';
    return;
  }

  const memberIdList = assignments.map(a => a.member_id);

  // ۲) گرفتن اطلاعات پروفایل همان نیروها
  const { data: allMembers, error: membersError } = await supabaseClient
    .from(TABLE_PROFILES)
    .select('id, backoffice_id, full_name, role')
    .in('id', memberIdList);

  if (membersError) {
    container.innerHTML = `<div class="empty-state">خطا در دریافت پروفایل نیروها: ${membersError.message}</div>`;
    document.getElementById('team-period-total').textContent = '—';
    return;
  }
  if (!allMembers || allMembers.length === 0) {
    container.innerHTML = '<div class="empty-state">هنوز نیرویی به شما اساین نشده است</div>';
    document.getElementById('team-period-total').textContent = '۰';
    return;
  }

  // کارشناسان تیکت (role = ticket_agent) جدا می‌شوند چون تارگتشون از جدول
  // ticket_agent_report خونده می‌شه، نه daily_targets؛ در تب مجزای «کارشناسان تیکت» نمایش داده می‌شن
  const ticketAgentMembers = allMembers.filter(m => m.role === 'ticket_agent');
  const members = allMembers.filter(m => m.role !== 'ticket_agent');

  loadTeamTicketAgents(ticketAgentMembers, period);

  if (members.length === 0) {
    container.innerHTML = '<div class="empty-state">هنوز نیرویی به شما اساین نشده است</div>';
    document.getElementById('team-period-total').textContent = '۰';
    renderTeamPerformance([], []);
    teamBugsFlat = [];
    renderTeamBugsList(teamBugsFlat);
    return;
  }

  const memberIds = members.map(m => m.id);

  // ۲) گرفتن تارگت همه‌ی این نیروها در بازه‌ی جاری، در یک درخواست
  const { data: rows, error: rowsError } = await supabaseClient
    .from(TABLE_TARGETS)
    .select('*')
    .in('user_id', memberIds)
    .gte('report_date_sort', period.startSort)
    .lte('report_date_sort', period.endSort)
    .order('report_date_sort', { ascending: true });

  if (rowsError) {
    container.innerHTML = `<div class="empty-state">خطا در دریافت تارگت‌ها: ${rowsError.message}</div>`;
    document.getElementById('team-period-total').textContent = '—';
    return;
  }

  // ۳) گرفتن خطاهای ثبت‌شده‌ی همه‌ی این نیروها (کل خطاها، مثل نمای شخصی هر کارشناس)
  const { data: bugRows, error: bugRowsError } = await supabaseClient
    .from(TABLE_BUGS)
    .select('*')
    .in('user_id', memberIds)
    .order('check_date_sort', { ascending: false });

  if (bugRowsError) {
    console.error('خطا در دریافت خطاهای نیروها:', bugRowsError.message);
  }

  // گروه‌بندی ردیف‌های تارگت بر اساس هر نیرو
  const rowsByUser = {};
  for (const r of (rows || [])) {
    if (!rowsByUser[r.user_id]) rowsByUser[r.user_id] = [];
    rowsByUser[r.user_id].push(r);
  }

  // گروه‌بندی خطاها بر اساس هر نیرو
  const bugsByUser = {};
  for (const b of (bugRows || [])) {
    if (!bugsByUser[b.user_id]) bugsByUser[b.user_id] = [];
    bugsByUser[b.user_id].push(b);
  }

  let teamTotal = 0;
  const membersWithTotals = members.map(m => {
    const myRows = rowsByUser[m.id] || [];
    const myBugs = bugsByUser[m.id] || [];
    const myTotal = myRows.reduce((sum, r) => sum + (Number(r.target_count) || 0), 0);
    teamTotal += myTotal;
    return { m, myRows, myBugs, myTotal };
  });

  // مرتب‌سازی نیروها بر اساس مجموع تارگت، از زیاد به کم
  membersWithTotals.sort((a, b) => b.myTotal - a.myTotal);

  const memberBlocks = buildMemberItemsHtml(membersWithTotals);

  container.innerHTML = memberBlocks;
  document.getElementById('team-period-total').textContent = formatNumber(teamTotal);

  // ---------- تب «خطای تیم»: لیست تخت همه‌ی خطاها به‌همراه backoffice_id کارشناس ----------
  teamBugsFlat = [];
  for (const m of members) {
    const displayName = m.full_name || m.backoffice_id || '—';
    for (const b of (bugsByUser[m.id] || [])) {
      teamBugsFlat.push({ ...b, _memberName: displayName });
    }
  }
  teamBugsFlat.sort((a, b) => (Number(b.check_date_sort) || 0) - (Number(a.check_date_sort) || 0));

  renderTeamBugsList(teamBugsFlat);

  // فعال کردن باز/بسته شدن هر ردیف با کلیک
  bindExpandableToggles(container);

  // ---------- تب «بررسی عملکرد»: میانگین تیم + نفرات زیر میانگین ----------
  document.getElementById('team-performance-period-label').textContent = `بازه‌ی جاری: ${period.startLabel} تا ${period.endLabel}`;
  renderTeamPerformance(membersWithTotals, rows || []);
}

/* =========================================================
   نمای سرگروه — تب «کارشناسان تیکت»
   - نیروهایی که role آن‌ها در profiles برابر ticket_agent است
   - تارگت هرکدام (مجموع امتیاز) از جدول ticket_agent_report خونده می‌شه
     (دقیقاً مثل نمای شخصیِ خودِ کارشناس تیکت، بدون فیلتر بازه، چون این جدول
     همیشه فقط داده‌ی بازه‌ی جاری رو نگه می‌داره)
   - کلیک روی هر نفر، ریز رشته‌ها/امتیازش رو باز/بسته می‌کنه
   ========================================================= */
async function loadTeamTicketAgents(ticketAgentMembers, period) {
  const listEl = document.getElementById('team-ticket-agents-list');
  const labelEl = document.getElementById('team-ticket-agents-period-label');

  if (labelEl && period) {
    labelEl.textContent = `بازه‌ی جاری: ${period.startLabel} تا ${period.endLabel}`;
  }

  if (!ticketAgentMembers || ticketAgentMembers.length === 0) {
    listEl.innerHTML = '<div class="empty-state">هنوز کارشناس تیکتی به شما اساین نشده است</div>';
    return;
  }

  const memberIds = ticketAgentMembers.map(m => m.id);

  const { data: reportRows, error: reportError } = await supabaseClient
    .from(TABLE_TICKET_AGENT_REPORT)
    .select('*')
    .in('user_id', memberIds);

  if (reportError) {
    listEl.innerHTML = `<div class="empty-state">خطا در دریافت گزارش کارشناسان تیکت: ${reportError.message}</div>`;
    return;
  }

  // گروه‌بندی ردیف‌های گزارش بر اساس هر کارشناس تیکت
  const rowsByUser = {};
  for (const r of (reportRows || [])) {
    if (!rowsByUser[r.user_id]) rowsByUser[r.user_id] = [];
    rowsByUser[r.user_id].push(r);
  }

  const membersWithTotals = ticketAgentMembers.map(m => {
    const myRows = rowsByUser[m.id] || [];
    const blocks = myRows.length ? buildTicketAgentReportBlocks(myRows) : null;
    const myTotal = blocks ? blocks.pointsTotal : 0;
    return { m, myRows, myTotal, blocks };
  });

  membersWithTotals.sort((a, b) => b.myTotal - a.myTotal);

  listEl.innerHTML = membersWithTotals.map(({ m, myRows, myTotal, blocks }) => {
    const displayName = m.full_name || m.backoffice_id || '—';

    // دیتیل هر کارشناس تیکت دقیقاً همون بلوک‌هایی‌یه که تو نمای شخصیِ خودش نشون داده می‌شه:
    // کارت مجموع تارگت، مبلغ قابل پرداخت و پاداش، و ریز هر رشته (تعداد تیکت، روزهای عادی/تعطیل و ...)
    const detailHtml = blocks
      ? `
          ${blocks.primaryHtml}
          <div class="ticket-hero-row">${blocks.heroHtml}</div>
          ${blocks.itemsHtml}
        `
      : '<div class="team-empty-days">هنوز گزارشی برای این بازه ثبت نشده است</div>';

    return `
      <div class="team-item" data-member="${m.id}">
        <button class="team-header" type="button">
          <div class="team-name-wrap">
            <svg class="team-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            <span class="team-name">${displayName}</span>

/* =========================================================
   نمای سرگروه — بررسی عملکرد
   - میانگین تیم = مجموع تارگت تیم / تعداد نفرات
   - نفراتی که مجموع تارگتشون کمتر از میانگین تیمه، نمایش داده می‌شن
   - «روزهای پرکار» برای هر نفر: روزهایی که تارگت آن روزش از میانگین
     روزانه‌ی خودش بیشتر بوده (یعنی روزهایی که بهتر از حد معمول خودش کار کرده)
   - «روزهای بدون صدور» برای هر نفر: روزهایی که بقیه‌ی اعضای تیم برای آن
     روز تارگت ثبت کرده‌اند ولی این نفر، برای همون روز هیچ ثبتی نداشته
   ========================================================= */
function renderTeamPerformance(membersWithTotals, allTeamRows) {
  const listEl = document.getElementById('team-performance-list');
  const avgEl = document.getElementById('team-performance-average');

  if (!membersWithTotals || membersWithTotals.length === 0) {
    avgEl.textContent = '—';
    listEl.innerHTML = '<div class="empty-state">نیرویی برای بررسی وجود ندارد</div>';
    return;
  }

  const teamAvg = membersWithTotals.reduce((sum, x) => sum + x.myTotal, 0) / membersWithTotals.length;
  avgEl.textContent = formatNumber(teamAvg);

  // مجموعه‌ی همه‌ی روزهایی که کل تیم (هر عضوی) برای آن‌ها تارگت ثبت کرده، برای تشخیص «روز بدون صدور» هر نفر
  const allTeamDatesMap = new Map();
  for (const r of allTeamRows) {
    if (r.report_date_jalali && !allTeamDatesMap.has(r.report_date_jalali)) {
      allTeamDatesMap.set(r.report_date_jalali, Number(r.report_date_sort) || 0);
    }
  }
  const allTeamDatesSorted = [...allTeamDatesMap.entries()].sort((a, b) => a[1] - b[1]);

  const belowAvgMembers = membersWithTotals
    .filter(x => x.myTotal < teamAvg)
    .sort((a, b) => a.myTotal - b.myTotal);
  const aboveAvgMembers = membersWithTotals
    .filter(x => x.myTotal >= teamAvg)
    .sort((a, b) => b.myTotal - a.myTotal);

  // ساخت آیتم کشویی برای هر نفر: روزهای پرکار (بالاتر از میانگین خودش) و روزهای بدون صدور (نسبت به بقیه‌ی تیم)
  function buildPerfItem({ m, myRows, myTotal }, isBelow) {
    const displayName = m.full_name || m.backoffice_id || '—';
    const ownAvg = myRows.length ? myTotal / myRows.length : 0;

    const goodDays = myRows
      .filter(r => (Number(r.target_count) || 0) > ownAvg)
      .sort((a, b) => (Number(b.target_count) || 0) - (Number(a.target_count) || 0));

    const myDatesSet = new Set(myRows.map(r => r.report_date_jalali));
    const missingDays = allTeamDatesSorted.filter(([date]) => !myDatesSet.has(date));

    const goodDaysHtml = goodDays.length
      ? goodDays.map(r => `
          <div class="team-day-row">
            <span class="team-day-date">${toJalaliDisplay(r.report_date_jalali)}</span>
            <span class="perf-day-badge-good">${formatNumber(r.target_count)}</span>
          </div>
        `).join('')
      : '<div class="team-empty-days">روز پرکاری (بالاتر از میانگین خودش) ثبت نشده</div>';

    const missingDaysHtml = missingDays.length
      ? missingDays.map(([date]) => `
          <div class="team-day-row">
            <span class="team-day-date">${toJalaliDisplay(date)}</span>
            <span class="perf-day-badge-missing">بدون صدور</span>
          </div>
        `).join('')
      : '<div class="team-empty-days">روز بدون صدوری ثبت نشده</div>';

    return `
      <div class="team-item" data-member="${m.id}">
        <button class="team-header" type="button">
          <div class="team-name-wrap">
            <svg class="team-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            <span class="team-name">${displayName}</span>
          </div>
          <div class="team-right">
            <span class="${isBelow ? 'perf-below-badge' : 'perf-above-badge'}">${isBelow ? 'زیر' : 'بالای'} میانگین</span>
            <span class="team-total">${formatNumber(myTotal)}</span>
          </div>
        </button>
        <div class="team-details">
          <div class="team-details-inner">
            <div class="team-section-title">روزهای پرکار (بالاتر از میانگین خودش)</div>
            ${goodDaysHtml}
            <div class="team-section-title">روزهای بدون صدور</div>
            ${missingDaysHtml}
          </div>
        </div>
      </div>
    `;
  }

  const belowHtml = belowAvgMembers.length
    ? belowAvgMembers.map(x => buildPerfItem(x, true)).join('')
    : '<div class="perf-group-empty">هیچ نیرویی زیر میانگین تیم نیست 🎉</div>';

  const aboveHtml = aboveAvgMembers.length
    ? aboveAvgMembers.map(x => buildPerfItem(x, false)).join('')
    : '<div class="perf-group-empty">هیچ نیرویی بالای میانگین تیم نیست</div>';

  listEl.innerHTML = `
    <div class="perf-group-header is-below">
      زیر میانگین تیم
      <span class="perf-group-count">${belowAvgMembers.length} نفر</span>
    </div>
    ${belowHtml}
    <div class="perf-group-divider"></div>
    <div class="perf-group-header is-above">
      بالای میانگین تیم
      <span class="perf-group-count">${aboveAvgMembers.length} نفر</span>
    </div>
    ${aboveHtml}
  `;

  bindExpandableToggles(listEl);
}

/* =========================================================
   نمای سوپروایزر
   - سرگروه‌های زیرمجموعه مستقیماً از ستون profiles.supervisor خوانده می‌شوند
     (روی پروفایل هر سرگروه، آیدی سوپروایزرش در همین ستون ذخیره شده)
   - نفرات هر سرگروه از همان جدول واسط تیم (team_assignments) خوانده می‌شود
   - کلیک روی هر سرگروه، لیست نفراتش را باز/بسته می‌کند
   - کلیک روی هر نفر، ریز تارگت روز به روزش را باز/بسته می‌کند
   ========================================================= */
async function loadSupervisorView(supervisorId) {
  const container = document.getElementById('supervisor-list');
  const period = currentPeriodBounds();
  document.getElementById('supervisor-period-label').textContent = `بازه‌ی جاری: ${period.startLabel} تا ${period.endLabel}`;

  // ۱) گرفتن پروفایل سرگروه‌های زیرمجموعه‌ی این سوپروایزر
  const { data: leaders, error: leadersError } = await supabaseClient
    .from(TABLE_PROFILES)
    .select('id, full_name, backoffice_id')
    .eq('supervisor', supervisorId)
    .eq('role', 'leader');

  if (leadersError) {
    container.innerHTML = `<div class="empty-state">خطا در دریافت لیست سرگروه‌ها: ${leadersError.message}</div>`;
    document.getElementById('supervisor-period-total').textContent = '—';
    return;
  }
  if (!leaders || leaders.length === 0) {
    container.innerHTML = '<div class="empty-state">هنوز سرگروهی به شما اساین نشده است</div>';
    document.getElementById('supervisor-period-total').textContent = '۰';
    supervisorBugsFlat = [];
    renderSupervisorBugsList(supervisorBugsFlat);
    return;
  }

  const leaderIdList = leaders.map(l => l.id);

  // ۳) گرفتن نفرات هرکدام از این سرگروه‌ها از جدول واسط تیم
  const { data: teamAssignments, error: teamAssignError } = await supabaseClient
    .from(TABLE_TEAM_ASSIGNMENTS)
    .select('leader_id, member_id')
    .in('leader_id', leaderIdList);

  if (teamAssignError) {
    container.innerHTML = `<div class="empty-state">خطا در دریافت لیست نفرات: ${teamAssignError.message}</div>`;
    document.getElementById('supervisor-period-total').textContent = '—';
    return;
  }

  const memberIds = [...new Set((teamAssignments || []).map(a => a.member_id))];

  // اگر هیچ نفری به هیچ‌کدام از این سرگروه‌ها اساین نشده باشد، فقط سرگروه‌ها را خالی نشان بده
  if (memberIds.length === 0) {
    container.innerHTML = leaders.map(l => `
      <div class="leader-item" data-leader="${l.id}">
        <button class="leader-header" type="button">
          <div class="leader-name-wrap">
            <svg class="leader-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            <span class="leader-name">${l.full_name || l.backoffice_id || '—'}</span>
          </div>
          <div class="leader-right">
            <span class="leader-total">۰</span>
          </div>
        </button>
        <div class="leader-details">
          <div class="leader-details-inner"><div class="team-empty-days">هنوز نیرویی به این سرگروه اساین نشده است</div></div>
        </div>
      </div>
    `).join('');
    document.getElementById('supervisor-period-total').textContent = '۰';
    bindExpandableToggles(container);
    supervisorBugsFlat = [];
    renderSupervisorBugsList(supervisorBugsFlat);
    return;
  }

  // ۴) گرفتن پروفایل همه‌ی نفرات زیرمجموعه‌ی همه‌ی این سرگروه‌ها
  const { data: members, error: membersError } = await supabaseClient
    .from(TABLE_PROFILES)
    .select('id, backoffice_id, full_name')
    .in('id', memberIds);

  if (membersError) {
    container.innerHTML = `<div class="empty-state">خطا در دریافت پروفایل نفرات: ${membersError.message}</div>`;
    document.getElementById('supervisor-period-total').textContent = '—';
    return;
  }

  const memberById = {};
  (members || []).forEach(m => { memberById[m.id] = m; });

  // ۵) گرفتن تارگت همه‌ی نفرات در بازه‌ی جاری، در یک درخواست
  const { data: rows, error: rowsError } = await supabaseClient
    .from(TABLE_TARGETS)
    .select('*')
    .in('user_id', memberIds)
    .gte('report_date_sort', period.startSort)
    .lte('report_date_sort', period.endSort)
    .order('report_date_sort', { ascending: true });

  if (rowsError) {
    container.innerHTML = `<div class="empty-state">خطا در دریافت تارگت‌ها: ${rowsError.message}</div>`;
    document.getElementById('supervisor-period-total').textContent = '—';
    return;
  }

  // ۶) گرفتن خطاهای ثبت‌شده‌ی همه‌ی این نفرات (کل خطاها)
  const { data: bugRows, error: bugRowsError } = await supabaseClient
    .from(TABLE_BUGS)
    .select('*')
    .in('user_id', memberIds)
    .order('check_date_sort', { ascending: false });

  if (bugRowsError) {
    console.error('خطا در دریافت خطاهای نفرات:', bugRowsError.message);
  }

  const rowsByUser = {};
  for (const r of (rows || [])) {
    if (!rowsByUser[r.user_id]) rowsByUser[r.user_id] = [];
    rowsByUser[r.user_id].push(r);
  }

  const bugsByUser = {};
  for (const b of (bugRows || [])) {
    if (!bugsByUser[b.user_id]) bugsByUser[b.user_id] = [];
    bugsByUser[b.user_id].push(b);
  }

  // گروه‌بندی id نفرات بر اساس هر سرگروه (بدون تکراری)
  const memberIdsByLeader = {};
  for (const a of (teamAssignments || [])) {
    if (!memberById[a.member_id]) continue; // نفری که پروفایلش پیدا نشد نادیده گرفته شود
    if (!memberIdsByLeader[a.leader_id]) memberIdsByLeader[a.leader_id] = [];
    if (!memberIdsByLeader[a.leader_id].includes(a.member_id)) {
      memberIdsByLeader[a.leader_id].push(a.member_id);
    }
  }

  let grandTotal = 0;
  const leadersWithTotals = leaders.map(l => {
    const myMemberIds = memberIdsByLeader[l.id] || [];
    let leaderTotal = 0;
    let leaderBugCount = 0;
    const membersWithTotals = myMemberIds.map(mid => {
      const m = memberById[mid];
      const myRows = rowsByUser[mid] || [];
      const myBugs = bugsByUser[mid] || [];
      const myTotal = myRows.reduce((sum, r) => sum + (Number(r.target_count) || 0), 0);
      leaderTotal += myTotal;
      leaderBugCount += myBugs.length;
      return { m, myRows, myBugs, myTotal };
    });
    // مرتب‌سازی نفرات هر سرگروه بر اساس مجموع تارگت، از زیاد به کم
    membersWithTotals.sort((a, b) => b.myTotal - a.myTotal);
    grandTotal += leaderTotal;
    return { l, membersWithTotals, leaderTotal, leaderBugCount };
  });

  // مرتب‌سازی سرگروه‌ها بر اساس مجموع تارگت تیمشان، از زیاد به کم
  leadersWithTotals.sort((a, b) => b.leaderTotal - a.leaderTotal);

  container.innerHTML = leadersWithTotals.map(({ l, membersWithTotals, leaderTotal, leaderBugCount }) => {
    const leaderName = l.full_name || l.backoffice_id || '—';
    const membersHtml = membersWithTotals.length
      ? buildMemberItemsHtml(membersWithTotals)
      : '<div class="team-empty-days">هنوز نیرویی به این سرگروه اساین نشده است</div>';
    return `
      <div class="leader-item" data-leader="${l.id}">
        <button class="leader-header" type="button">
          <div class="leader-name-wrap">
            <svg class="leader-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            <span class="leader-name">${leaderName}</span>
          </div>
          <div class="leader-right">
            <span class="leader-bug-total">${leaderBugCount} خطا</span>
            <span class="leader-total">${formatNumber(leaderTotal)}</span>
          </div>
        </button>
        <div class="leader-details">
          <div class="leader-details-inner">
            <div class="list-card" style="box-shadow:none;">${membersHtml}</div>
          </div>
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('supervisor-period-total').textContent = formatNumber(grandTotal);

  // ---------- تب «خطای کل»: لیست تخت همه‌ی خطاها به‌همراه نام نفر و نام سرگروه ----------
  supervisorBugsFlat = [];
  for (const { l, membersWithTotals } of leadersWithTotals) {
    const leaderName = l.full_name || l.backoffice_id || '—';
    for (const { m, myBugs } of membersWithTotals) {
      const displayName = m.full_name || m.backoffice_id || '—';
      for (const b of myBugs) {
        supervisorBugsFlat.push({ ...b, _memberName: displayName, _leaderName: leaderName });
      }
    }
  }
  supervisorBugsFlat.sort((a, b) => (Number(b.check_date_sort) || 0) - (Number(a.check_date_sort) || 0));
  renderSupervisorBugsList(supervisorBugsFlat);

  // فعال کردن باز/بسته شدن سرگروه‌ها و نفرات هرکدام با کلیک
  bindExpandableToggles(container);
}

let currentUserId = null;
